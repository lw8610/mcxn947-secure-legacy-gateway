# Full NXP ELS/PKC PSA profile.  PSA dispatch can offload symmetric crypto,
# hashing/MAC, key agreement, signatures and key generation to ELS/PKC.
CONFIG_MCUX_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC_THREAD=y

# Explicitly keep the algorithms needed by the self-test and TLS 1.2 suites.
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
