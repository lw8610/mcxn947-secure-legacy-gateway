CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
# DHCP-only network profile for use with different routers and subnets.
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
# Some routers and Ethernet MACs cannot deliver a unicast DHCPOFFER before
# the client owns an IPv4 address.  Request broadcast replies for maximum
# compatibility across validation networks.
CONFIG_NET_DHCPV4_ACCEPT_UNICAST=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=60
CONFIG_NET_CONFIG_MY_IPV4_NETMASK=""
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_PRINTK=y
CONFIG_NET_SHELL=y
CONFIG_SHELL=y
CONFIG_MAIN_STACK_SIZE=8192
# getaddrinfo() allocates its result array from the Zephyr system heap.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# TLS / HTTPS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Two simultaneous TLS client contexts need separate 16 KiB input/output
# record buffers. Reserve enough Mbed TLS heap for both handshakes.
CONFIG_MBEDTLS_HEAP_SIZE=114688
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_TLS_MAX_SESSION_CONTEXTS=2
CONFIG_NET_SOCKETS_TLS_MAX_CLIENT_SESSION_COUNT=2
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=7
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=7
CONFIG_ENTROPY_GENERATOR=y

# TLS client / TLS 1.2

# TLS 1.2 + cipher suite for Zephyr 4.4
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

# DNS
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_NET_DHCPV4_DNS_SERVER_VIA_INTERFACE=y
CONFIG_DNS_NUM_CONCUR_QUERIES=4
# Keep enough resolver work buffers for all configured query slots.
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=4
CONFIG_DNS_RESOLVER_CACHE=y
CONFIG_DNS_RESOLVER_CACHE_MAX_ENTRIES=8
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=128

# Match Zephyr official http_get TLS sample
# Allow full-size TLS records from general HTTPS servers.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_HASH_ALL_ENABLED=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_SHA_1=y

# Match Zephyr official http_get TLS sample
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y

CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# TLS debug

CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y

CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

CONFIG_PSA_WANT_ECC_SECP_R1_384=y

# IE 5 opens several short-lived parallel connections while DNS and the
# listening socket are also active.  Keep spare TCP contexts so a new HTTPS
# socket can be created before recently closed connections are fully released.
CONFIG_NET_MAX_CONN=12
CONFIG_NET_MAX_CONTEXTS=12
# Enforce the per-client request deadline used by the proxy.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
# Keep a stalled legacy client from holding a worker indefinitely.
CONFIG_NET_SOCKET_MAX_SEND_WAIT=10000
# The proxy actively closes every short-lived HTTP connection. Avoid retaining
# scarce contexts in TIME_WAIT, as done by Zephyr's HTTP server samples.
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

CONFIG_MBEDTLS_ECP_NIST_OPTIM=y

# Keep one full Ethernet frame in one net_buf. The ENET driver reserves
# 16 RX buffers for its DMA descriptors. Apple-class pages can keep both
# proxy workers and a few pending client sockets active at once, so retain
# 20 additional buffers for the IP/TCP stack while keeping each TCP receive
# window bounded at 4 KiB.
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_RX_COUNT=36
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096
