# Portable software-crypto profile. TLS and PSA remain enabled by prj.conf.
# This file deliberately does not enable CONFIG_MCUX_ELS_PKC or
# CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC, so cryptographic operations use the
# software implementation. The board's hardware ELS TRNG remains enabled as
# its cryptographically secure entropy source.
